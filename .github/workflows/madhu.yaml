
name: Manual CI-CD to VM

on:
  push:
    branches: [ master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Build application
        run: mvn clean package
      - name: Detect artifact type
        run: |
         if ls target/*.jar 1> /dev/null 2>&1; then
         echo "JAR file detected"
         elif ls target/*.war 1> /dev/null 2>&1; then
         echo "WAR file detected"
         else
         echo "No JAR or WAR found"
         exit 1
         fi

        

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: app
          path: target/*.war

  deploy:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: app
          path: .

      - name: Create SSH private key
        run: |
          echo "${{ secrets.VM_SSH_KEY }}" > key.pem
          chmod 700 key.pem

      - name: Prepare directory on VM
        run: |
          ssh -o StrictHostKeyChecking=no \
              -i key.pem \
              ${{ secrets.VM_USER }}@${{ secrets.VM_HOST }} \
              "mkdir -p /home/${{ secrets.VM_USER }}/app"

      - name: Copy WAR to VM
        run: |
          scp -o StrictHostKeyChecking=no \
              -i key.pem \
              *.war \
              ${{ secrets.VM_USER }}@${{ secrets.VM_HOST }}:/home/${{ secrets.VM_USER }}/app

      - name: Restart application on VM
        run: |
          ssh -o StrictHostKeyChecking=no \
              -i key.pem \
              ${{ secrets.VM_USER }}@${{ secrets.VM_HOST }} \
              "pkill -f java || true && \
               cd /home/${{ secrets.VM_USER }}/app && \
               nohup java -jar *.jar > app.log 2>&1 &"
